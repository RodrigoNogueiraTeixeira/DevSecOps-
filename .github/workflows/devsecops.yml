name: Esteira DevSecOps Automatizada

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. VARREDURA DE SEGREDOS (Secret Scanning)
  # ============================================================================
  secret-scanning:
    name: "1. Secret Scanning (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo-fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Executar Gitleaks (Security Gate)
        run: |
          echo "🔍 Iniciando varredura de segredos hardcoded no repositorio..."
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
            detect --source="/repo" --no-git --verbose --exit-code 1
          echo "✅ Nenhum segredo exposto encontrado!"

  # ============================================================================
  # 2. ANALISE ESTATICA DE SEGURANCA (SAST) + TESTES UNITARIOS
  # ============================================================================
  sast-and-unit-tests:
    name: "2. SAST & Unit Tests (Semgrep + Maven)"
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - name: Checkout do codigo-fonte
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Executar Testes Automatizados da API (Maven)
        run: mvn test -B

      - name: Executar SAST com Semgrep (Security Gate)
        run: |
          echo "🔍 Executando analise estatica SAST (Java / OWASP Top 10)..."
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep:latest \
            semgrep scan --config "p/java" --config "p/owasp-top-ten" \
            --error --severity ERROR /src/src/main
          echo "✅ Codigo-fonte aprovado no SAST!"

  # ============================================================================
  # 3. SEGURANCA NA CADEIA DE SUPRIMENTOS (SCA & SBOM)
  # ============================================================================
  sca-and-sbom:
    name: "3. SCA & SBOM (Trivy + CycloneDX)"
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - name: Checkout do codigo-fonte
        uses: actions/checkout@v4

      - name: Configurar Java 21 e Cache Maven
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Resolver dependencias Maven localmente (evita rate-limit 429 no Trivy)
        run: mvn dependency:resolve -B

      - name: Gerar SBOM no formato CycloneDX
        run: |
          echo "📦 Gerando inventario SBOM (CycloneDX) das dependencias..."
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -v "$HOME/.m2:/root/.m2:ro" \
            aquasec/trivy:latest \
            fs --format cyclonedx --output /project/sbom-cyclonedx.json /project
          ls -lh sbom-cyclonedx.json

      - name: Publicar Artefato SBOM (CycloneDX)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-artifact
          path: sbom-cyclonedx.json
          retention-days: 30

      - name: Executar SCA nas dependencias do pom.xml (Security Gate)
        run: |
          echo "🔍 Analisando vulnerabilidades (CVEs) nas bibliotecas do pom.xml..."
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -v "$HOME/.m2:/root/.m2:ro" \
            aquasec/trivy:latest \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /project
          echo "✅ Nenhuma vulnerabilidade HIGH ou CRITICAL encontrada nas dependencias!"

  # ============================================================================
  # 4. CONTEINERIZACAO E INFRAESTRUTURA COMO CODIGO (IaC & Container Security)
  # ============================================================================
  container-and-iac-security:
    name: "4. Container & IaC Security (Checkov + Trivy Image)"
    runs-on: ubuntu-latest
    needs: [sast-and-unit-tests, sca-and-sbom]
    steps:
      - name: Checkout do codigo-fonte
        uses: actions/checkout@v4

      - name: Verificar boas praticas do Dockerfile (Nao-Root + Healthcheck)
        run: |
          echo "🔍 Verificando se o Dockerfile define usuario nao-root (USER)..."
          if ! grep -Eq "^USER [a-zA-Z0-9_-]+" Dockerfile; then
            echo "❌ ERRO DE SEGURANCA: O Dockerfile nao define um usuario nao-root (execucao como root detectada)!"
            exit 1
          fi
          if grep -Eq "^USER (root|0)" Dockerfile; then
            echo "❌ ERRO DE SEGURANCA: O Dockerfile esta configurado explicitamente para rodar como root!"
            exit 1
          fi
          echo "✅ Dockerfile configurado com usuario nao-root!"

      - name: Analise Estatica de IaC (Kubernetes & Dockerfile) com Checkov (Security Gate)
        run: |
          echo "🔍 Executando Checkov nos manifestos Kubernetes e Dockerfile..."
          docker run --rm -v "${{ github.workspace }}:/tf" bridgecrew/checkov:latest \
            -d /tf/k8s -f /tf/Dockerfile \
            --framework kubernetes dockerfile \
            --check CKV_K8S_6,CKV_K8S_8,CKV_K8S_9,CKV_K8S_10,CKV_K8S_11,CKV_K8S_12,CKV_K8S_13,CKV_K8S_20,CKV_K8S_22,CKV_K8S_23,CKV_DOCKER_2,CKV_DOCKER_3 \
            --compact
          echo "✅ Manifestos de IaC e Dockerfile aprovados pelo Checkov!"

      - name: Construir Imagem Docker da Aplicacao
        run: docker build -t devsecops-spring-api:test .

      - name: Escanear Imagem Docker Construida com Trivy (Security Gate)
        run: |
          echo "🔍 Escaneando imagem Docker construida em busca de CVEs criticas..."
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 devsecops-spring-api:test
          echo "✅ Imagem Docker aprovada sem CVEs criticas!"

  # ============================================================================
  # 5. ANALISE DINAMICA DE SEGURANCA (DAST)
  # ============================================================================
  dast-security:
    name: "5. DAST - Analise Dinamica da API (Live Container + Nuclei)"
    runs-on: ubuntu-latest
    needs: container-and-iac-security
    steps:
      - name: Checkout do codigo-fonte
        uses: actions/checkout@v4

      - name: Construir e Subir Container da API em Staging Efemero
        run: |
          docker build -t devsecops-spring-api:dast .
          docker run -d --name api-staging -p 8080:8080 devsecops-spring-api:dast
          echo "⏳ Aguardando inicializacao da API Spring Boot..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/api/health | grep -q "UP"; then
              echo "✅ API online e respondendo!"
              break
            fi
            sleep 2
          done

      - name: DAST Parte 1 - Testar Resiliencia de Endpoints e Cabecalhos HTTP (Security Gate)
        run: |
          echo "🔍 Testando cabecalhos de seguranca HTTP na API em execucao..."
          HEADERS=$(curl -sI http://localhost:8080/api/items)
          echo "$HEADERS"

          for REQUIRED_HEADER in "X-Content-Type-Options: nosniff" "X-Frame-Options: DENY" "Content-Security-Policy" "Referrer-Policy: no-referrer"; do
            if ! echo "$HEADERS" | grep -qi "$REQUIRED_HEADER"; then
              echo "❌ FALHA DAST: Cabecalho obrigatorio ausente ou incorreto: $REQUIRED_HEADER"
              exit 1
            fi
          done
          echo "✅ Todos os cabecalhos de protecao HTTP estao ativos!"

          echo "🔍 Testando bloqueio de payload invalido (Bean Validation)..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/api/items \
            -H "Content-Type: application/json" \
            -d '{"name":"","category":""}')
          if [ "$HTTP_CODE" -ne 400 ]; then
            echo "❌ FALHA DAST: A API aceitou um payload invalido (esperado HTTP 400, recebido $HTTP_CODE)!"
            exit 1
          fi
          echo "✅ Validacao de entrada (HTTP 400 Bad Request) funcionando corretamente!"

          echo "🔍 Testando resiliencia contra tentativa de SQL Injection via parametro de query..."
          SQLI_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/api/items?category=security'%20OR%20'1'='1")
          if [ "$SQLI_CODE" -ne 200 ]; then
            echo "❌ FALHA DAST: Erro inesperado ao processar tentativa de SQL Injection (HTTP $SQLI_CODE)!"
            exit 1
          fi
          echo "✅ Endpoint resiliente contra payload de SQL Injection!"

      - name: DAST Parte 2 - Scanner Dinamico Automatizado com Nuclei (Security Gate)
        run: |
          echo "🔍 Executando scanner dinamico Nuclei contra a API..."
          docker run --rm --network host projectdiscovery/nuclei:latest \
            -u http://localhost:8080/api/items \
            -t http/misconfiguration/ -t http/exposures/ \
            -severity high,critical \
            -silent -nc
          echo "✅ Varredura dinamica com Nuclei concluida sem vulnerabilidades graves!"

      - name: Coletar Logs e Finalizar Ambiente Efemero
        if: always()
        run: |
          docker logs api-staging || true
          docker rm -f api-staging || true
