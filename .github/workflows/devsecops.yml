# Nome exibido na aba "Actions" do GitHub
name: Esteira DevSecOps Automatizada

# Gatilhos (quando a esteira dispara automaticamente)
on:
  push: # Executa ao fazer git push nas branches abaixo
    branches: [ "main", "master" ] # Branches monitoradas no push
  pull_request: # Executa ao abrir ou atualizar um Pull Request
    branches: [ "main", "master" ] # Branches alvo do Pull Request
  workflow_dispatch: # Permite disparo manual via botao no GitHub

# Definicao dos estagios (jobs) da pipeline
jobs:
  # ============================================================================
  # 1. VARREDURA DE SEGREDOS (Secret Scanning)
  # ============================================================================
  secret-scanning: # ID interno do job 1
    name: "1. Secret Scanning (Gitleaks)" # Nome amigavel na interface do GitHub
    runs-on: ubuntu-latest # Maquina Linux virtual na nuvem do GitHub
    steps: # Lista de passos executados neste job
      - name: Checkout do codigo-fonte # Passo 1: baixa o repositorio na maquina
        uses: actions/checkout@v4 # Action oficial do GitHub para clonar o repo
        with: # Parametros da action
          fetch-depth: 0 # Baixa o historico completo de commits

      - name: Executar Gitleaks (Security Gate) # Passo 2: procura senhas/chaves vazadas
        run: | # Executa comandos shell no Linux
          echo "🔍 Iniciando varredura de segredos hardcoded no repositorio..." # Log informativo
          # Baixa e executa o Gitleaks via Docker montando o codigo em /repo
          # --exit-code 1 atua como Security Gate (bloqueia a pipeline se achar segredo)
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
            detect --source="/repo" --no-git --verbose --exit-code 1
          echo "✅ Nenhum segredo exposto encontrado!" # Log exibido apenas se passar

  # ============================================================================
  # 2. ANALISE ESTATICA DE SEGURANCA (SAST) + TESTES UNITARIOS
  # ============================================================================
  sast-and-unit-tests: # ID interno do job 2
    name: "2. SAST & Unit Tests (Semgrep + Maven)" # Nome amigavel na interface
    runs-on: ubuntu-latest # Maquina Linux virtual na nuvem do GitHub
    needs: secret-scanning # So roda se o job 1 (Secret Scanning) passar
    steps: # Lista de passos executados neste job
      - name: Checkout do codigo-fonte # Passo 1: baixa o codigo-fonte
        uses: actions/checkout@v4 # Action oficial de clone

      - name: Configurar Java 21 # Passo 2: instala JDK 21 para rodar o Maven
        uses: actions/setup-java@v4 # Action oficial de configuracao do Java
        with: # Parametros da action
          java-version: '21' # Versao do Java usada no projeto
          distribution: 'temurin' # Distribuicao OpenJDK (Eclipse Temurin)
          cache: 'maven' # Guarda cache do ~/.m2 para acelerar builds

      - name: Executar Testes Automatizados da API (Maven) # Passo 3: roda JUnit/MockMvc
        run: mvn test -B # Executa os testes em modo batch (nao interativo)

      - name: Executar SAST com Semgrep (Security Gate) # Passo 4: analisa falhas no codigo Java
        run: | # Executa comandos shell no Linux
          echo "🔍 Executando analise estatica SAST (Java / OWASP Top 10)..." # Log informativo
          # Executa o Semgrep via Docker aplicando regras de Java e OWASP Top 10
          # --error --severity ERROR bloqueia a pipeline ao detectar falha grave
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep:latest \
            semgrep scan --config "p/java" --config "p/owasp-top-ten" \
            --error --severity ERROR /src/src/main
          echo "✅ Codigo-fonte aprovado no SAST!" # Log exibido apenas se passar

  # ============================================================================
  # 3. SEGURANCA NA CADEIA DE SUPRIMENTOS (SCA & SBOM)
  # ============================================================================
  sca-and-sbom: # ID interno do job 3
    name: "3. SCA & SBOM (Trivy + CycloneDX)" # Nome amigavel na interface
    runs-on: ubuntu-latest # Maquina Linux virtual na nuvem do GitHub
    needs: secret-scanning # Roda em paralelo ao job 2, apos o job 1 passar
    steps: # Lista de passos executados neste job
      - name: Checkout do codigo-fonte # Passo 1: baixa o codigo-fonte
        uses: actions/checkout@v4 # Action oficial de clone

      - name: Configurar Java 21 e Cache Maven # Passo 2: prepara Java e cache ~/.m2
        uses: actions/setup-java@v4 # Action oficial do Java
        with: # Parametros da action
          java-version: '21' # Versao do Java
          distribution: 'temurin' # Distribuicao OpenJDK
          cache: 'maven' # Reutiliza dependencias ja baixadas

      - name: Resolver dependencias Maven localmente (evita rate-limit 429 no Trivy) # Passo 3
        run: mvn dependency:resolve -B # Popula ~/.m2 para o Trivy ler localmente

      - name: Gerar SBOM no formato CycloneDX # Passo 4: cria inventario de software
        run: | # Executa comandos shell no Linux
          echo "📦 Gerando inventario SBOM (CycloneDX) das dependencias..." # Log informativo
          # Usa o Trivy via Docker lendo o projeto e o cache Maven para gerar o SBOM
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -v "$HOME/.m2:/root/.m2:ro" \
            aquasec/trivy:latest \
            fs --format cyclonedx --output /project/sbom-cyclonedx.json /project
          ls -lh sbom-cyclonedx.json # Confirma tamanho e existencia do arquivo gerado

      - name: Publicar Artefato SBOM (CycloneDX) # Passo 5: disponibiliza download no GitHub
        uses: actions/upload-artifact@v4 # Action oficial para salvar artefatos
        with: # Parametros da action
          name: sbom-cyclonedx-artifact # Nome do pacote para download na aba Summary
          path: sbom-cyclonedx.json # Caminho do arquivo SBOM gerado
          retention-days: 30 # Tempo de retencao do artefato no GitHub

      - name: Executar SCA nas dependencias do pom.xml (Security Gate) # Passo 6: busca CVEs
        run: | # Executa comandos shell no Linux
          echo "🔍 Analisando vulnerabilidades (CVEs) nas bibliotecas do pom.xml..." # Log informativo
          # Escaneia dependencias em busca de CVEs HIGH/CRITICAL com correcao disponivel
          # --exit-code 1 atua como Security Gate bloqueando bibliotecas vulneraveis
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -v "$HOME/.m2:/root/.m2:ro" \
            aquasec/trivy:latest \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /project
          echo "✅ Nenhuma vulnerabilidade HIGH ou CRITICAL encontrada nas dependencias!" # Log final

  # ============================================================================
  # 4. CONTEINERIZACAO E INFRAESTRUTURA COMO CODIGO (IaC & Container Security)
  # ============================================================================
  container-and-iac-security: # ID interno do job 4
    name: "4. Container & IaC Security (Checkov + Trivy Image)" # Nome amigavel
    runs-on: ubuntu-latest # Maquina Linux virtual na nuvem do GitHub
    needs: [sast-and-unit-tests, sca-and-sbom] # So roda se SAST e SCA passarem
    steps: # Lista de passos executados neste job
      - name: Checkout do codigo-fonte # Passo 1: baixa o codigo-fonte
        uses: actions/checkout@v4 # Action oficial de clone

      - name: Verificar boas praticas do Dockerfile (Nao-Root + Healthcheck) # Passo 2
        run: | # Executa validacao rapida de seguranca no Dockerfile
          echo "🔍 Verificando se o Dockerfile define usuario nao-root (USER)..." # Log informativo
          if ! grep -Eq "^USER [a-zA-Z0-9_-]+" Dockerfile; then # Checa se existe diretiva USER
            echo "❌ ERRO DE SEGURANCA: O Dockerfile nao define um usuario nao-root (execucao como root detectada)!"
            exit 1 # Security Gate: falha se nao houver usuario definido
          fi # Fim do primeiro if
          if grep -Eq "^USER (root|0)" Dockerfile; then # Checa se USER foi definido como root
            echo "❌ ERRO DE SEGURANCA: O Dockerfile esta configurado explicitamente para rodar como root!"
            exit 1 # Security Gate: falha se rodar explicitamente como root
          fi # Fim do segundo if
          echo "✅ Dockerfile configurado com usuario nao-root!" # Log de aprovacao

      - name: Analise Estatica de IaC (Kubernetes & Dockerfile) com Checkov (Security Gate) # Passo 3
        run: | # Executa o Checkov nos arquivos de infraestrutura
          echo "🔍 Executando Checkov nos manifestos Kubernetes e Dockerfile..." # Log informativo
          # Valida regras criticas de Kubernetes (non-root, readOnlyFS, limits) e Dockerfile
          docker run --rm -v "${{ github.workspace }}:/tf" bridgecrew/checkov:latest \
            -d /tf/k8s -f /tf/Dockerfile \
            --framework kubernetes dockerfile \
            --check CKV_K8S_6,CKV_K8S_8,CKV_K8S_9,CKV_K8S_10,CKV_K8S_11,CKV_K8S_12,CKV_K8S_13,CKV_K8S_20,CKV_K8S_22,CKV_K8S_23,CKV_DOCKER_2,CKV_DOCKER_3 \
            --compact
          echo "✅ Manifestos de IaC e Dockerfile aprovados pelo Checkov!" # Log de aprovacao

      - name: Construir Imagem Docker da Aplicacao # Passo 4: compila o container
        run: docker build -t devsecops-spring-api:test . # Gera imagem local a partir do Dockerfile

      - name: Escanear Imagem Docker Construida com Trivy (Security Gate) # Passo 5
        run: | # Escaneia pacotes do SO e bibliotecas dentro da imagem pronta
          echo "🔍 Escaneando imagem Docker construida em busca de CVEs criticas..." # Log informativo
          # Monta o socket do Docker para o Trivy inspecionar a imagem construida
          # --exit-code 1 bloqueia se encontrar qualquer vulnerabilidade CRITICAL corrigivel
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 devsecops-spring-api:test
          echo "✅ Imagem Docker aprovada sem CVEs criticas!" # Log de aprovacao

  # ============================================================================
  # 5. ANALISE DINAMICA DE SEGURANCA (DAST)
  # ============================================================================
  dast-security: # ID interno do job 5
    name: "5. DAST - Analise Dinamica da API (Live Container + Nuclei)" # Nome amigavel
    runs-on: ubuntu-latest # Maquina Linux virtual na nuvem do GitHub
    needs: container-and-iac-security # So roda se o job 4 (Container & IaC) passar
    steps: # Lista de passos executados neste job
      - name: Checkout do codigo-fonte # Passo 1: baixa o codigo-fonte
        uses: actions/checkout@v4 # Action oficial de clone

      - name: Construir e Subir Container da API em Staging Efemero # Passo 2
        run: | # Sobe a API de verdade em background para testes dinamicos
          docker build -t devsecops-spring-api:dast . # Constroi a imagem para o DAST
          docker run -d --name api-staging -p 8080:8080 devsecops-spring-api:dast # Sobe na porta 8080
          echo "⏳ Aguardando inicializacao da API Spring Boot..." # Log informativo
          for i in {1..30}; do # Tenta ate 30 vezes (60 segundos) conectar no healthcheck
            if curl -s http://localhost:8080/api/health | grep -q "UP"; then # Verifica status UP
              echo "✅ API online e respondendo!" # Log quando a API fica pronta
              break # Sai do loop assim que responder
            fi # Fim da verificacao
            sleep 2 # Aguarda 2 segundos antes da proxima tentativa
          done # Fim do loop de espera

      - name: DAST Parte 1 - Testar Resiliencia de Endpoints e Cabecalhos HTTP (Security Gate) # Passo 3
        run: | # Dispara requisicoes HTTP reais validando protecoes da API
          echo "🔍 Testando cabecalhos de seguranca HTTP na API em execucao..." # Log informativo
          HEADERS=$(curl -sI http://localhost:8080/api/items) # Captura cabecalhos HTTP da resposta
          echo "$HEADERS" # Exibe os cabecalhos no log da pipeline

          # Loop que valida a presenca de cada cabecalho obrigatorio de seguranca
          for REQUIRED_HEADER in "X-Content-Type-Options: nosniff" "X-Frame-Options: DENY" "Content-Security-Policy" "Referrer-Policy: no-referrer"; do
            if ! echo "$HEADERS" | grep -qi "$REQUIRED_HEADER"; then # Se faltar algum cabecalho
              echo "❌ FALHA DAST: Cabecalho obrigatorio ausente ou incorreto: $REQUIRED_HEADER"
              exit 1 # Security Gate: bloqueia a esteira
            fi # Fim do if
          done # Fim do loop de cabecalhos
          echo "✅ Todos os cabecalhos de protecao HTTP estao ativos!" # Log de aprovacao

          echo "🔍 Testando bloqueio de payload invalido (Bean Validation)..." # Log informativo
          # Envia JSON vazio e captura apenas o codigo HTTP retornado
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/api/items \
            -H "Content-Type: application/json" \
            -d '{"name":"","category":""}')
          if [ "$HTTP_CODE" -ne 400 ]; then # Espera 400 Bad Request para entrada invalida
            echo "❌ FALHA DAST: A API aceitou um payload invalido (esperado HTTP 400, recebido $HTTP_CODE)!"
            exit 1 # Security Gate: bloqueia se validacao falhar
          fi # Fim do if
          echo "✅ Validacao de entrada (HTTP 400 Bad Request) funcionando corretamente!" # Log

          echo "🔍 Testando resiliencia contra tentativa de SQL Injection via parametro de query..." # Log
          # Envia payload classico de SQL Injection no filtro da URL
          SQLI_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/api/items?category=security'%20OR%20'1'='1")
          if [ "$SQLI_CODE" -ne 200 ]; then # API deve responder 200 (lista vazia) sem erro 500
            echo "❌ FALHA DAST: Erro inesperado ao processar tentativa de SQL Injection (HTTP $SQLI_CODE)!"
            exit 1 # Security Gate: bloqueia se a API quebrar com SQLi
          fi # Fim do if
          echo "✅ Endpoint resiliente contra payload de SQL Injection!" # Log de aprovacao

      - name: DAST Parte 2 - Scanner Dinamico Automatizado com Nuclei (Security Gate) # Passo 4
        run: | # Roda scanner dinamico contra a API ligada na porta 8080
          echo "🔍 Executando scanner dinamico Nuclei contra a API..." # Log informativo
          # Executa templates de ma configuracao e exposicoes na rede local (--network host)
          docker run --rm --network host projectdiscovery/nuclei:latest \
            -u http://localhost:8080/api/items \
            -t http/misconfiguration/ -t http/exposures/ \
            -severity high,critical \
            -silent -nc
          echo "✅ Varredura dinamica com Nuclei concluida sem vulnerabilidades graves!" # Log final

      - name: Coletar Logs e Finalizar Ambiente Efemero # Passo 5: limpeza do container
        if: always() # Executa sempre, mesmo se algum passo anterior falhar
        run: | # Exibe logs da API e remove o container de staging
          docker logs api-staging || true # Imprime os logs do Spring Boot para auditoria
          docker rm -f api-staging || true # Encerra e remove o container temporario
