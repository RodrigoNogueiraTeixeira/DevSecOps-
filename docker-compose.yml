services:
  devsecops-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devsecops-spring-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
